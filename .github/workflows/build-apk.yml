name: Build TVQuizLock APK
run-name: TVQuizLock Android CI · ${{ github.ref_name }} · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - commercial-dev

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare optional fixed signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          PRESENT=0
          MISSING=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then
              PRESENT=1
            else
              MISSING=1
            fi
          done
          if [ "$PRESENT" -eq 0 ]; then
            echo "::notice::No fixed signing key configured; the debug APK will be signed for testing and the release APK will be unsigned."
          elif [ "$MISSING" -ne 0 ]; then
            echo "::error::Incomplete release signing secrets. Configure all four secrets or leave all four empty."
            exit 1
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tvquizlock-release.keystore"
            test -s "$RUNNER_TEMP/tvquizlock-release.keystore"
            echo "Fixed signing key is available."
          fi

      - name: Run tests, lint and build debug plus release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tvquizlock-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug assembleRelease

      - name: Verify fixed release APK signature
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tvquizlock-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ ! -s "$ANDROID_KEYSTORE_PATH" ]; then
            echo "::notice::No fixed signing key configured; skipping certificate identity verification for this unsigned release build."
            exit 0
          fi
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Android apksigner tool not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          APK_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | sed -nE 's/.*certificate SHA-256 digest: *//p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          KEY_CERT_SHA256="$(keytool -list -v -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | sed -nE 's/^[[:space:]]*SHA256: *//p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$APK_CERT_SHA256" ] || [ -z "$KEY_CERT_SHA256" ]; then
            echo "::error::Unable to read APK or keystore certificate SHA-256 fingerprint."
            exit 1
          fi
          if [ "$APK_CERT_SHA256" != "$KEY_CERT_SHA256" ]; then
            echo "::error::Release APK certificate does not match the fixed TVQuizLock signing key."
            exit 1
          fi
          echo "Release APK signature verified. Certificate SHA-256: $APK_CERT_SHA256"

      - name: Upload test and release APKs
        uses: actions/upload-artifact@v5
        with:
          name: TVQuizLock-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
