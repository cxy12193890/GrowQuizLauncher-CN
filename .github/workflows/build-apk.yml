name: Build TVQuizLock APK

on:
  workflow_dispatch:
  push:
    branches:
      - commercial-dev

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare optional fixed signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tvquizlock-release.keystore"
            test -s "$RUNNER_TEMP/tvquizlock-release.keystore"
            echo "Fixed signing key is available."
          else
            echo "::notice::No fixed signing key configured; the debug APK will be signed for testing and the release APK will be unsigned."
          fi

      - name: Run tests, lint and build debug plus release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tvquizlock-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug assembleRelease

      - name: Upload test and release APKs
        uses: actions/upload-artifact@v5
        with:
          name: TVQuizLock-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
